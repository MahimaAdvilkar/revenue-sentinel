# Revenue Sentinel — CI
#
# Runs entirely OFFLINE. No ANTHROPIC_API_KEY, no network calls to any model
# provider. DEMO_MODE=fixture replays recorded responses (ADR-0007).
#
# Rule 13: no gate here is ever bypassed. No `continue-on-error`, no skipped
# tests, no loosened assertions to get green.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEMO_MODE: fixture
  APP_ENV: ci
  SEED: "20260801"
  EVALUATION_TIMESTAMP: "2026-08-01T12:00:00Z"

jobs:
  quality:
    name: Lint, format, types, boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Layer boundaries (import-linter)
        run: uv run lint-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel_ci
          POSTGRES_DB: revenue_sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d revenue_sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI has no port conflict, so the standard port is fine here. Local
      # development uses 55432 — see docker-compose.yml.
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_ci@localhost:5432/revenue_sentinel

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Seed
        run: uv run python -m scripts.seed

      # The integration suite creates and drops its own `revenue_sentinel_test`
      # database, so it does not disturb the seeded one above.
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -ra

      # The Session 3-7 guard against an empty tests/evaluation/ is gone: the rubric
      # suite exists now, and a guard that tolerates emptiness would let a future
      # deletion pass silently.
      - name: Workflow evaluation suite
        run: uv run pytest tests/evaluation -ra

  frontend:
    name: Frontend contract, typecheck, build, tests
    runs-on: ubuntu-latest
    # No database and no API key: the dashboard builds against a checked-in OpenAPI
    # schema, so this job is fast and fully offline.
    #
    # Step order matters. `tests/offline.test.ts` scans the **built output** for CDN,
    # font, and analytics hosts, so the build has to happen before the tests -- running
    # them the other way round either fails on a missing `.next` or, worse, passes
    # against a stale one.
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # `--frozen-lockfile` fails when the lockfile drifted from package.json rather
      # than silently resolving something else.
      - name: Install
        run: pnpm install --frozen-lockfile

      # The frontend half of ADR-0023: `generated/api.ts` must be exactly what the
      # generator produces from the committed `generated/openapi.json`. This needs no
      # Python and no backend, and it catches the one failure the `contract` job below
      # cannot see -- a hand-edited generated file. The `contract` job checks the other
      # half: that `openapi.json` still matches the live FastAPI app.
      - name: Generated types match the committed schema
        run: |
          pnpm generate:api
          if ! git diff --quiet -- generated/api.ts; then
            echo "::error::generated/api.ts was hand-edited or is stale. Run 'make generate-api-types'."
            git --no-pager diff -- generated/api.ts
            exit 1
          fi
          echo "generated/api.ts matches generated/openapi.json."

      - name: Typecheck
        run: pnpm typecheck

      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build output exists for the offline scan to inspect
        run: test -d .next || { echo "::error::no build output"; exit 1; }

      # Includes the offline built-output scan, which is why it runs after the build.
      - name: Tests
        run: pnpm test

  contract:
    name: Generated API contract is current
    runs-on: ubuntu-latest
    # ADR-0023's guarantee only holds if something enforces it. A backend field
    # rename merged without regenerating leaves the frontend compiling against a
    # stale contract -- which is exactly the silent drift generation exists to
    # prevent, and nothing else in CI would notice.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.3

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          uv sync --all-extras
          cd apps/web && pnpm install --frozen-lockfile

      - name: Regenerate the contract
        run: |
          uv run python -m scripts.export_openapi
          cd apps/web && pnpm generate:api

      - name: Fail if the committed contract is stale
        run: |
          if ! git diff --quiet -- apps/web/generated; then
            echo "::error::apps/web/generated is out of date. Run 'make generate-api-types' and commit the result."
            git --no-pager diff --stat -- apps/web/generated
            exit 1
          fi
          echo "Generated contract matches the API."

  fixtures:
    name: LLM fixtures match the prompts
    runs-on: ubuntu-latest
    # A changed prompt template invalidates every recorded fixture, because the
    # prompt digest is the fixture's filename. Today that surfaces as a
    # FixtureMissError when somebody runs the demo; it should surface here.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12.3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check fixture freshness
        run: uv run python -m scripts.check_fixtures

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if a real Anthropic key is present
        run: |
          # Matches the live-key prefix only — the literal string
          # "ANTHROPIC_API_KEY=" in .env.example is fine.
          if grep -rIn --exclude-dir=.git -E 'sk-ant-[A-Za-z0-9]' .; then
            echo "::error::Possible Anthropic API key committed."
            exit 1
          fi
          echo "No API key patterns found."

      - name: Fail if .env is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. It must be ignored."
            exit 1
          fi
          echo ".env is not tracked."
