# Alembic configuration.
#
# NOTE: `sqlalchemy.url` is deliberately absent. The database URL comes from
# DATABASE_URL via `revenue_sentinel.core.config`, so there is exactly one source of
# truth for it. A URL duplicated here would eventually disagree with the application
# and migrate the wrong database -- which on this machine means the Homebrew
# PostgreSQL on 5432 rather than the container on 55432.

[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
